name: iTAC Software
description: 'iTAC Software AG is an independent company of the Duerr Group and a leading provider of
  Manufacturing Execution System (MES) and Manufacturing Operations Management (MOM) software for discrete
  manufacturing. Its iTAC.MOM.Suite delivers production control, end-to-end traceability, quality management,
  and AI-supported analytics that help automotive, electronics, and medical-technology manufacturers
  implement Industry 4.0 and smart-factory operations. iTAC does not publish a public developer API,
  developer portal, or SDKs; system integration is delivered through the MOM platform''s IoT and connectivity
  layers as part of a project engagement.'
